<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Frota">
<title>Controle de Frota</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="icons/icon-192.png" alt=""><div><b>Controle de Frota</b><small>Revisões e manutenção</small></div></div>
  <button class="icon-btn" id="btnMenu" aria-label="Menu">⋮</button>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main id="main"></main>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head"><h2 id="modalTitle"></h2><button class="icon-btn" data-close aria-label="Fechar">✕</button></div>
    <div class="sheet-body" id="modalBody"></div>
  </div>
</div>
<div class="viewer" id="viewer" hidden><img id="viewerImg" alt=""><button class="icon-btn" data-closeviewer aria-label="Fechar">✕</button></div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
